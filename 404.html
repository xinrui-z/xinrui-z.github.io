<!doctype html>

  <style>
    :root { --paper: #fff; --ink: #111; --muted: #666; }
    @media (prefers-color-scheme: dark) { :root { --paper: #0e0e0e; --ink: #f0f0f0; --muted: #9b9b9b; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper); color: var(--ink);
      font: 400 15px/1.7 ui-monospace, Menlo, Consolas, monospace; }
    main { padding: 32px 16px; text-align: center; }
    svg { width: 96px; height: auto; shape-rendering: crispEdges; fill: var(--ink); }
    h1 { margin: 16px 0 4px; font-size: 20px; font-weight: 500; text-transform: uppercase; letter-spacing: .06em; }
    p { margin: 0; color: var(--muted); }
    a { display: inline-block; margin-top: 20px; padding: 6px 12px; border: 2px solid var(--ink); color: var(--ink); text-decoration: none; }
    a:hover { background: var(--ink); color: var(--paper); }
  </style>
</head>

  <main>

    <svg viewBox="0 0 12 10" aria-hidden="true">

</body>
</html>
